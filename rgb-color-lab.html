<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB颜色混合实验室</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #f1f1f1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        header {
            text-align: center;
            padding: 20px 0;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff7e5f, #feb47b, #86a8e7, #91eae4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #a0a0c0;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }
        
        .color-controls {
            flex: 1;
            min-width: 300px;
            background: rgba(30, 30, 46, 0.7);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .color-display {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        .mixed-color-box {
            flex: 1;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .color-info {
            background: rgba(30, 30, 46, 0.7);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .slider-container {
            margin-bottom: 25px;
        }
        
        .slider-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .slider-label {
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .slider-value {
            font-weight: 700;
            font-size: 1.3rem;
            min-width: 40px;
            text-align: right;
        }
        
        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 16px;
            border-radius: 10px;
            background: #2a2a3e;
            outline: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .red-slider::-webkit-slider-thumb {
            background: #ff4757;
        }
        
        .green-slider::-webkit-slider-thumb {
            background: #2ed573;
        }
        
        .blue-slider::-webkit-slider-thumb {
            background: #3742fa;
        }
        
        .red-slider {
            background: linear-gradient(to right, #000, #ff4757);
        }
        
        .green-slider {
            background: linear-gradient(to right, #000, #2ed573);
        }
        
        .blue-slider {
            background: linear-gradient(to right, #000, #3742fa);
        }
        
        .color-code {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .hex-code-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .hex-label {
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .hex-value {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            font-family: monospace;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .copy-btn {
            background: #4b4b6e;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }
        
        .copy-btn:hover {
            background: #5a5a8a;
            transform: translateY(-2px);
        }
        
        .copy-btn:active {
            transform: translateY(0);
        }
        
        .copy-btn.copied {
            background: #2ed573;
        }
        
        .color-examples {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .color-example {
            height: 80px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .color-example:hover {
            transform: translateY(-5px);
        }
        
        .rgb-values {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .rgb-value {
            text-align: center;
            font-size: 1.1rem;
        }
        
        .value-number {
            font-size: 1.8rem;
            font-weight: 800;
            display: block;
            margin-top: 5px;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            margin-top: 20px;
            color: #a0a0c0;
            font-size: 0.9rem;
        }
        
        .color-name {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .mixed-color-desc {
            font-size: 1.1rem;
            text-align: center;
            max-width: 400px;
            line-height: 1.6;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .color-examples {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 480px) {
            .color-examples {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .hex-code-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>RGB颜色混合实验室</h1>
            <p class="subtitle">通过调整红、绿、蓝颜色分量创建您自己的颜色。拖动滑块实时查看颜色混合效果，并复制HEX颜色代码用于您的项目。</p>
        </header>
        
        <main class="main-content">
            <section class="color-controls">
                <div class="slider-container">
                    <div class="slider-header">
                        <div class="slider-label">
                            <i class="fas fa-square" style="color: #ff4757;"></i>
                            <span>红色 (R)</span>
                        </div>
                        <div class="slider-value" id="red-value">127</div>
                    </div>
                    <input type="range" min="0" max="255" value="127" class="slider red-slider" id="red-slider">
                </div>
                
                <div class="slider-container">
                    <div class="slider-header">
                        <div class="slider-label">
                            <i class="fas fa-square" style="color: #2ed573;"></i>
                            <span>绿色 (G)</span>
                        </div>
                        <div class="slider-value" id="green-value">127</div>
                    </div>
                    <input type="range" min="0" max="255" value="127" class="slider green-slider" id="green-slider">
                </div>
                
                <div class="slider-container">
                    <div class="slider-header">
                        <div class="slider-label">
                            <i class="fas fa-square" style="color: #3742fa;"></i>
                            <span>蓝色 (B)</span>
                        </div>
                        <div class="slider-value" id="blue-value">127</div>
                    </div>
                    <input type="range" min="0" max="255" value="127" class="slider blue-slider" id="blue-slider">
                </div>
                
                <div class="color-code">
                    <div class="hex-code-container">
                            <div class="hex-label">HEX颜色码:</div>
                            <div class="hex-value" id="hex-value">#7F7F7F</div>
                        </div>
                        <button class="copy-btn" id="copy-btn">
                            <i class="far fa-copy"></i>
                            <span>复制HEX代码</span>
                        </button>
                </div>
                
                <div class="rgb-values">
                    <div class="rgb-value">
                        <div>红色</div>
                        <div class="value-number" id="red-num">127</div>
                    </div>
                    <div class="rgb-value">
                        <div>绿色</div>
                        <div class="value-number" id="green-num">127</div>
                    </div>
                    <div class="rgb-value">
                        <div>蓝色</div>
                        <div class="value-number" id="blue-num">127</div>
                    </div>
                </div>
            </section>
            
            <section class="color-display">
                <div class="mixed-color-box" id="mixed-color-box">
                    <div class="color-name" id="color-name">中性灰</div>
                    <p class="mixed-color-desc" id="color-desc">红色、绿色和蓝色分量相等时产生中性灰色</p>
                </div>
                
                <div class="color-info">
                    <h3><i class="fas fa-palette"></i> 颜色示例</h3>
                    <p>点击下方颜色示例快速应用</p>
                    <div class="color-examples">
                        <div class="color-example" style="background-color: #FF6B6B; color: white;" data-r="255" data-g="107" data-b="107">珊瑚红</div>
                        <div class="color-example" style="background-color: #4ECDC4; color: white;" data-r="78" data-g="205" data-b="196">绿松石</div>
                        <div class="color-example" style="background-color: #FFD166; color: #333;" data-r="255" data-g="209" data-b="102">琥珀黄</div>
                        <div class="color-example" style="background-color: #06D6A0; color: white;" data-r="6" data-g="214" data-b="160">翡翠绿</div>
                        <div class="color-example" style="background-color: #118AB2; color: white;" data-r="17" data-g="138" data-b="178">海洋蓝</div>
                        <div class="color-example" style="background-color: #9D4EDD; color: white;" data-r="157" data-g="78" data-b="221">紫水晶</div>
                    </div>
                </div>
            </section>
        </main>
        
        <footer class="footer">
            <p>RGB颜色混合实验室 &copy; 2023 | 每个颜色分量值范围: 0-255 | HEX颜色码格式: #RRGGBB</p>
        </footer>
    </div>

    <script>
        // 获取DOM元素
        const redSlider = document.getElementById('red-slider');
        const greenSlider = document.getElementById('green-slider');
        const blueSlider = document.getElementById('blue-slider');
        
        const redValue = document.getElementById('red-value');
        const greenValue = document.getElementById('green-value');
        const blueValue = document.getElementById('blue-value');
        
        const redNum = document.getElementById('red-num');
        const greenNum = document.getElementById('green-num');
        const blueNum = document.getElementById('blue-num');
        
        const hexValue = document.getElementById('hex-value');
        const copyBtn = document.getElementById('copy-btn');
        
        const mixedColorBox = document.getElementById('mixed-color-box');
        const colorName = document.getElementById('color-name');
        const colorDesc = document.getElementById('color-desc');
        
        const colorExamples = document.querySelectorAll('.color-example');
        
        // 初始化颜色
        let red = 127;
        let green = 127;
        let blue = 127;
        
        // 更新颜色显示
        function updateColor() {
            // 更新显示值
            redValue.textContent = red;
            greenValue.textContent = green;
            blueValue.textContent = blue;
            
            redNum.textContent = red;
            greenNum.textContent = green;
            blueNum.textContent = blue;
            
            // 生成HEX颜色码
            const hexColor = rgbToHex(red, green, blue);
            hexValue.textContent = hexColor;
            
            // 更新混合颜色显示
            mixedColorBox.style.background = `linear-gradient(135deg, rgba(${red}, ${green}, ${blue}, 0.9) 0%, rgba(${Math.min(red+50, 255)}, ${Math.min(green+50, 255)}, ${Math.min(blue+50, 255)}, 0.9) 100%)`;
            
            // 根据亮度调整文字颜色
            const brightness = (red * 0.299 + green * 0.587 + blue * 0.114);
            const textColor = brightness > 150 ? '#333' : '#fff';
            mixedColorBox.style.color = textColor;
            
            // 更新颜色名称和描述
            updateColorInfo(red, green, blue, hexColor);
        }
        
        // RGB转HEX函数
        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
        }
        
        // 更新颜色信息
        function updateColorInfo(r, g, b, hex) {
            // 判断颜色类型
            let name = "自定义颜色";
            let desc = "由您自定义的RGB颜色组合";
            
            if (r === g && g === b) {
                if (r < 50) {
                    name = "接近黑色";
                    desc = "RGB三个分量都很低，接近黑色";
                } else if (r > 200) {
                    name = "接近白色";
                    desc = "RGB三个分量都很高，接近白色";
                } else {
                    name = "中性灰";
                    desc = "红色、绿色和蓝色分量相等时产生中性灰色";
                }
            } else if (r > 200 && g < 100 && b < 100) {
                name = "红色系";
                desc = "红色分量较高，绿色和蓝色分量较低";
            } else if (g > 200 && r < 100 && b < 100) {
                name = "绿色系";
                desc = "绿色分量较高，红色和蓝色分量较低";
            } else if (b > 200 && r < 100 && g < 100) {
                name = "蓝色系";
                desc = "蓝色分量较高，红色和绿色分量较低";
            } else if (r > 200 && g > 200 && b < 100) {
                name = "黄色系";
                desc = "红色和绿色分量较高，蓝色分量较低";
            } else if (r > 200 && b > 200 && g < 100) {
                name = "紫色系";
                desc = "红色和蓝色分量较高，绿色分量较低";
            } else if (g > 200 && b > 200 && r < 100) {
                name = "青色系";
                desc = "绿色和蓝色分量较高，红色分量较低";
            } else if (r > 200 && g > 150 && b < 100) {
                name = "橙色系";
                desc = "红色分量很高，绿色分量中等，蓝色分量低";
            }
            
            colorName.textContent = name;
            colorDesc.textContent = desc;
        }
        
        // 复制HEX代码
        copyBtn.addEventListener('click', function() {
            const hexText = hexValue.textContent;
            
            // 使用现代Clipboard API
            navigator.clipboard.writeText(hexText).then(() => {
                // 更新按钮状态
                const originalText = copyBtn.querySelector('span').textContent;
                const originalIcon = copyBtn.querySelector('i').className;
                
                copyBtn.querySelector('span').textContent = '已复制!';
                copyBtn.querySelector('i').className = 'fas fa-check';
                copyBtn.classList.add('copied');
                
                // 2秒后恢复原状
                setTimeout(() => {
                    copyBtn.querySelector('span').textContent = originalText;
                    copyBtn.querySelector('i').className = originalIcon;
                    copyBtn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('复制失败: ', err);
                // 如果Clipboard API失败，使用备用方法
                const textArea = document.createElement('textarea');
                textArea.value = hexText;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                
                // 更新按钮状态
                copyBtn.querySelector('span').textContent = '已复制!';
                copyBtn.querySelector('i').className = 'fas fa-check';
                copyBtn.classList.add('copied');
                
                setTimeout(() => {
                    copyBtn.querySelector('span').textContent = '复制HEX代码';
                    copyBtn.querySelector('i').className = 'far fa-copy';
                    copyBtn.classList.remove('copied');
                }, 2000);
            });
        });
        
        // 滑块事件监听
        redSlider.addEventListener('input', function() {
            red = parseInt(this.value);
            updateColor();
        });
        
        greenSlider.addEventListener('input', function() {
            green = parseInt(this.value);
            updateColor();
        });
        
        blueSlider.addEventListener('input', function() {
            blue = parseInt(this.value);
            updateColor();
        });
        
        // 颜色示例点击事件
        colorExamples.forEach(example => {
            example.addEventListener('click', function() {
                red = parseInt(this.dataset.r);
                green = parseInt(this.dataset.g);
                blue = parseInt(this.dataset.b);
                
                // 更新滑块位置
                redSlider.value = red;
                greenSlider.value = green;
                blueSlider.value = blue;
                
                // 更新显示
                updateColor();
                
                // 添加点击反馈
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 200);
            });
        });
        
        // 初始化颜色
        updateColor();
        
        // 添加键盘控制功能
        document.addEventListener('keydown', function(e) {
            let step = 5;
            if (e.shiftKey) step = 1;
            if (e.ctrlKey || e.metaKey) step = 20;
            
            switch(e.key) {
                case 'r':
                case 'R':
                    red = Math.min(Math.max(red + (e.shiftKey ? -step : step), 0), 255);
                    redSlider.value = red;
                    updateColor();
                    break;
                case 'g':
                case 'G':
                    green = Math.min(Math.max(green + (e.shiftKey ? -step : step), 0), 255);
                    greenSlider.value = green;
                    updateColor();
                    break;
                case 'b':
                case 'B':
                    blue = Math.min(Math.max(blue + (e.shiftKey ? -step : step), 0), 255);
                    blueSlider.value = blue;
                    updateColor();
                    break;
            }
        });
        
        // 添加随机颜色生成功能
        function generateRandomColor() {
            red = Math.floor(Math.random() * 256);
            green = Math.floor(Math.random() * 256);
            blue = Math.floor(Math.random() * 256);
            
            redSlider.value = red;
            greenSlider.value = green;
            blueSlider.value = blue;
            
            updateColor();
        }
        
        // 添加随机颜色按钮
        const randomBtn = document.createElement('button');
        randomBtn.innerHTML = '<i class="fas fa-dice"></i> 随机颜色';
        randomBtn.className = 'copy-btn';
        randomBtn.style.marginTop = '15px';
        randomBtn.style.width = '100%';
        randomBtn.style.justifyContent = 'center';
        randomBtn.addEventListener('click', generateRandomColor);
        document.querySelector('.color-code').appendChild(randomBtn);
        
        // 添加键盘快捷键提示
        const hint = document.createElement('div');
        hint.innerHTML = '<p style="margin-top: 20px; font-size: 0.9rem; color: #a0a0c0; text-align: center;">提示: 按 R, G, B 键可微调颜色 (配合 Shift/Ctrl 键调整步长)</p>';
        document.querySelector('.color-controls').appendChild(hint);
    </script>
</body>
</html>
